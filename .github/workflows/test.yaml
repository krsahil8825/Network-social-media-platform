name: Django Tests

on:
  push:
  pull_request:

jobs:
  test_project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Install dependencies
        run: |
          uv sync

      - name: Run migrations
        env:
          SECRET_KEY: ci-test-secret-key
          DB_ENGINE: sqlite
        run: |
          uv run python manage.py migrate

      - name: Run tests
        env:
          SECRET_KEY: ci-test-secret-key
          DB_ENGINE: sqlite
        run: |
          uv run python manage.py test --verbosity=2
